<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- PWA -->

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary SEO -->

    <meta name="description" content="ProblemAtlas — The World's Problem Intelligence Platform. Discover, validate and solve real-world verified problems across Healthcare, AI, Energy, FinTech and 140+ industries." />
    <meta name="keywords" content="problem intelligence, startup ideas, validated problems, market research, pain points, innovation platform, real problems, problem statement" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ProblemAtlas" />
    <meta name="theme-color" content="#1657FF" />
    <link rel="canonical" href="https://problematlas.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />

    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ProblemAtlas" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="ProblemAtlas — The World's Problem Intelligence Platform" />
    <meta name="twitter:description" content="Discover, validate and solve real-world verified problems. Built for founders, researchers and changemakers." />
    <meta name="twitter:image" content="https://problematlas.com/og-image.png" />

    <!-- DNS-Prefetch and Preconnects for Core Web Vitals Performance -->
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Google Fonts: 2 families only (Inter + Plus Jakarta Sans) — optimized weights only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
