services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: stuckhere-web:latest
    container_name: stuckhere-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
