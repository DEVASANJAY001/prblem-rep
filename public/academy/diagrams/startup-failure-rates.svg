<svg viewBox="0 0 760 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="220" rx="12" fill="#F8FAFC"/>
  <text x="30" y="32" fill="#0F172A" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">Top Reasons Startups Fail (CB Insights Post-Mortem Analysis)</text>

  <text x="30" y="68" fill="#1E293B" font-size="13" font-weight="semibold" font-family="system-ui, sans-serif">No Market Need</text>
  <rect x="200" y="52" width="315" height="22" rx="4" fill="#E11D48"/>
  <text x="525" y="68" fill="#E11D48" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">42% (Building what nobody wants)</text>

  <text x="30" y="104" fill="#334155" font-size="13" font-family="system-ui, sans-serif">Ran Out of Cash</text>
  <rect x="200" y="88" width="217" height="22" rx="4" fill="#475569"/>
  <text x="427" y="104" fill="#475569" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">29%</text>

  <text x="30" y="140" fill="#334155" font-size="13" font-family="system-ui, sans-serif">Wrong Team</text>
  <rect x="200" y="124" width="172" height="22" rx="4" fill="#64748B"/>
  <text x="382" y="140" fill="#64748B" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">23%</text>

  <text x="30" y="176" fill="#334155" font-size="13" font-family="system-ui, sans-serif">Got Outcompeted</text>
  <rect x="200" y="160" width="142" height="22" rx="4" fill="#94A3B8"/>
  <text x="352" y="176" fill="#94A3B8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">19%</text>

  <text x="30" y="206" fill="#64748B" font-size="11" font-family="system-ui, sans-serif">Key Insight: Startups rarely die of competition; they die of silence from customers who have no real pain.</text>
</svg>