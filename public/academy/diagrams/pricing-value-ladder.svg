    <text x="15" y="75" fill="#64748B" font-size="11" font-family="system-ui, sans-serif">• Server hosting: $20</text>
    <text x="15" y="93" fill="#64748B" font-size="11" font-family="system-ui, sans-serif">• You charge: $24</text>
    <text x="15" y="118" fill="#DC2626" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Leaves 90% of value on table</text>
  </g>

  <!-- Mid -->
  <g transform="translate(275, 50)">
