<svg viewBox="0 0 760 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="170" rx="12" fill="#F8FAFC"/>
  <text x="380" y="26" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">The Survey Sampling &amp; Bias Elimination Funnel</text>

  <rect x="24" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6"/>
  <text x="108" y="70" fill="#0284C7" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Target Population</text>
  <text x="108" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">All potential buyers</text>
  <text x="108" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">e.g. 50,000 Indian clinics</text>
  <text x="108" y="130" fill="#0369A1" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Total Problem Domain</text>

  <rect x="206" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
  <text x="290" y="70" fill="#D97706" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Sampling Frame</text>
  <text x="290" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Accessible subset</text>
  <text x="290" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">500 registry contacts</text>
  <text x="290" y="130" fill="#B45309" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Check Coverage Bias</text>

  <rect x="388" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="472" y="70" fill="#7C3AED" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Qualified Responses</text>
  <text x="472" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Filtered survey replies</text>
  <text x="472" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Drop speeders (&lt;60s)</text>
  <text x="472" y="130" fill="#6D28D9" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">High-Integrity Sample</text>

  <rect x="570" y="46" width="166" height="106" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <text x="653" y="70" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. Confidence Bounds</text>
  <text x="653" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&plusmn; 5% Margin of Error</text>
  <text x="653" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">95% Confidence Interval</text>
  <text x="653" y="130" fill="#047857" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Defensible Signal</text>
</svg>