<svg viewBox="0 0 760 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="170" rx="12" fill="#F8FAFC"/>
  <text x="380" y="26" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">SQL Relational Joins for Problem Solvers: Visual Logic &amp; Pitfalls</text>

  <rect x="24" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="108" y="70" fill="#2563EB" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">INNER JOIN</text>
  <text x="108" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Only matching records</text>
  <text x="108" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Users who also bought</text>
  <text x="108" y="130" fill="#1D4ED8" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Drops Unmatched Left/Right</text>

  <rect x="206" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <text x="290" y="70" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">LEFT JOIN (Builder Standard)</text>
  <text x="290" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">All left rows + matched right</text>
  <text x="290" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">All users + order history (if any)</text>
  <text x="290" y="130" fill="#047857" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Preserves Funnel Base</text>

  <rect x="388" y="46" width="168" height="106" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
  <text x="472" y="70" fill="#D97706" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">RIGHT JOIN</text>
  <text x="472" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">All right rows + matched left</text>
  <text x="472" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Rarely used in practice</text>
  <text x="472" y="130" fill="#B45309" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Flip to LEFT JOIN instead</text>

  <rect x="570" y="46" width="166" height="106" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="653" y="70" fill="#7C3AED" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">FULL OUTER JOIN</text>
  <text x="653" y="92" fill="#334155" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">All records from both sides</text>
  <text x="653" y="108" fill="#64748B" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Unmatched show NULL</text>
  <text x="653" y="130" fill="#6D28D9" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Audit Reconciliation</text>
</svg>