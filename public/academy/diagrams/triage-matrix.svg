<svg viewBox="0 0 760 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="170" rx="12" fill="#F8FAFC"/>
  <text x="380" y="28" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">The Three Problem Categories: Triage Matrix</text>

  <rect x="24" y="46" width="224" height="106" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="40" y="74" fill="#475569" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">💊 VITAMIN</text>
  <text x="40" y="98" fill="#334155" font-size="12" font-family="system-ui, sans-serif">• Nice to have upgrade</text>
  <text x="40" y="118" fill="#334155" font-size="12" font-family="system-ui, sans-serif">• Reaction: "That sounds cool"</text>
  <text x="40" y="138" fill="#94A3B8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Danger: High churn, no budget</text>

  <rect x="268" y="46" width="224" height="106" rx="8" fill="#FFFFFF" stroke="#0056D2" stroke-width="2"/>
  <text x="284" y="74" fill="#0056D2" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">⚡ PAINKILLER</text>
  <text x="284" y="98" fill="#1E293B" font-size="12" font-weight="semibold" font-family="system-ui, sans-serif">• Felt daily, urgent friction</text>
  <text x="284" y="118" fill="#1E293B" font-size="12" font-weight="semibold" font-family="system-ui, sans-serif">• Operators already hack patches</text>
  <text x="284" y="138" fill="#0056D2" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Sweet Spot for Early Founders</text>

  <rect x="512" y="46" width="224" height="106" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="528" y="74" fill="#DC2626" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">🏥 SURGERY</text>
  <text x="528" y="98" fill="#334155" font-size="12" font-family="system-ui, sans-serif">• Critical existential risk</text>
  <text x="528" y="118" fill="#334155" font-size="12" font-family="system-ui, sans-serif">• Heavy compliance &amp; committee</text>
  <text x="528" y="138" fill="#DC2626" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Requires enterprise funding</text>
